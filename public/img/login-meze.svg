<?xml version="1.0" encoding="UTF-8"?>
<!--
  Latar halaman masuk 2 — meja meze dilihat dari atas.

  Piring-piring kecil khas meze: hummus, ezme, cacik, zaitun, roti pita.
  Sengaja dilihat tegak lurus dari atas supaya bentuknya terbaca sebagai
  lingkaran sederhana dan tetap jelas walau diredupkan lapisan gelap.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="Meja meze">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="0.5" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#3f1d0b"/>
    </linearGradient>

    <radialGradient id="lamp" cx="0.44" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#fed7aa" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette2" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Motif bunga Iznik yang disederhanakan. -->
    <pattern id="iznik" width="200" height="200" patternUnits="userSpaceOnUse">
      <g stroke="#fde68a" stroke-opacity="0.11" fill="none" stroke-width="2">
        <path d="M100 48 C 128 74, 128 126, 100 152 C 72 126, 72 74, 100 48 Z"/>
        <path d="M48 100 C 74 72, 126 72, 152 100 C 126 128, 74 128, 48 100 Z"/>
        <circle cx="100" cy="100" r="7"/>
        <circle cx="0" cy="0" r="26"/>
        <circle cx="200" cy="0" r="26"/>
        <circle cx="0" cy="200" r="26"/>
        <circle cx="200" cy="200" r="26"/>
      </g>
    </pattern>

    <!-- Satu piring meze: tepi terang, isi berwarna. -->
    <g id="dish">
      <circle r="100" fill="#0c0a09" fill-opacity="0.34"/>
      <circle r="100" fill="none" stroke="#fef3c7" stroke-opacity="0.34" stroke-width="4"/>
      <circle r="80" fill="none" stroke="#fef3c7" stroke-opacity="0.18" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="url(#cloth)"/>
  <rect width="1600" height="1200" fill="url(#iznik)"/>
  <rect width="1600" height="1200" fill="url(#lamp)"/>

  <!-- Piring besar di tengah: meze campur. -->
  <g transform="translate(760 560)">
    <circle r="230" fill="#0c0a09" fill-opacity="0.30"/>
    <circle r="230" fill="none" stroke="#fef3c7" stroke-opacity="0.30" stroke-width="5"/>
    <circle r="196" fill="none" stroke="#fef3c7" stroke-opacity="0.15" stroke-width="2"/>
    <g fill-opacity="0.5">
      <circle cx="-88" cy="-52" r="62" fill="#fbbf24"/>
      <circle cx="82" cy="-66" r="58" fill="#dc2626"/>
      <circle cx="96" cy="72" r="60" fill="#65a30d"/>
      <circle cx="-76" cy="86" r="56" fill="#fef3c7"/>
      <circle cx="4" cy="8" r="42" fill="#f97316"/>
    </g>
  </g>

  <!-- Piring-piring kecil mengelilingi. -->
  <g>
    <g transform="translate(300 300)"><use href="#dish"/><circle r="70" fill="#fbbf24" fill-opacity="0.42"/></g>
    <g transform="translate(1270 330)"><use href="#dish"/><circle r="70" fill="#dc2626" fill-opacity="0.42"/></g>
    <g transform="translate(250 880)"><use href="#dish"/><circle r="70" fill="#65a30d" fill-opacity="0.42"/></g>
    <g transform="translate(1210 860)"><use href="#dish"/><circle r="70" fill="#fef3c7" fill-opacity="0.34"/></g>
    <g transform="translate(790 1060)"><use href="#dish"/><circle r="70" fill="#f97316" fill-opacity="0.40"/></g>
  </g>

  <!-- Roti pita, digambar sebagai elips dengan guratan panggang. -->
  <g transform="translate(1420 620) rotate(-18)">
    <ellipse rx="120" ry="92" fill="#fbbf24" fill-opacity="0.26"/>
    <ellipse rx="120" ry="92" fill="none" stroke="#fde68a" stroke-opacity="0.26" stroke-width="3"/>
    <g stroke="#7c2d12" stroke-opacity="0.26" stroke-width="5" stroke-linecap="round">
      <line x1="-58" y1="-28" x2="58" y2="-28"/>
      <line x1="-66" y1="4" x2="66" y2="4"/>
      <line x1="-52" y1="36" x2="52" y2="36"/>
    </g>
  </g>

  <rect width="1600" height="1200" fill="url(#vignette2)"/>
</svg>
