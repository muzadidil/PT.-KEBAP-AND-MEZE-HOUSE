<?xml version="1.0" encoding="UTF-8"?>
<!--
  Latar halaman masuk 1 — panggangan arang.

  Gambar vektor buatan sendiri, bukan foto stok: tidak ada urusan lisensi,
  tajam di layar seberapa pun besarnya, dan beratnya hanya beberapa kilobita.
  Pemilik boleh menggantinya dengan foto asli lewat Admin → Tampilan.

  Dirancang untuk dilihat di balik lapisan gelap (lihat .auth-slide::after),
  jadi warnanya sengaja pekat supaya tetap terbaca setelah diredupkan.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="Panggangan arang">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="0.55" stop-color="#9f1239"/>
      <stop offset="1" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Bara di bawah panggangan. -->
    <radialGradient id="ember" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ea580c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Bintang delapan, motif ubin Turki. -->
    <pattern id="tile" width="160" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <g fill="none" stroke="#fed7aa" stroke-opacity="0.13" stroke-width="2">
        <rect x="40" y="40" width="80" height="80"/>
        <rect x="40" y="40" width="80" height="80" transform="rotate(45 80 80)"/>
        <circle cx="80" cy="80" r="10"/>
      </g>
      <g fill="#fed7aa" fill-opacity="0.06">
        <circle cx="0" cy="0" r="5"/>
        <circle cx="160" cy="0" r="5"/>
        <circle cx="0" cy="160" r="5"/>
        <circle cx="160" cy="160" r="5"/>
      </g>
    </pattern>

    <!-- Satu tusuk sate: batang tipis dengan potongan daging berselang. -->
    <g id="skewer">
      <rect x="-460" y="-5" width="920" height="10" rx="5" fill="#0c0a09" fill-opacity="0.55"/>
      <g fill="#1c0f0a" fill-opacity="0.62">
        <rect x="-330" y="-46" width="118" height="92" rx="30"/>
        <rect x="-186" y="-52" width="126" height="104" rx="34"/>
        <rect x="-34" y="-46" width="118" height="92" rx="30"/>
        <rect x="110" y="-52" width="126" height="104" rx="34"/>
        <rect x="262" y="-42" width="108" height="84" rx="28"/>
      </g>
      <g fill="#fb923c" fill-opacity="0.16">
        <rect x="-330" y="-46" width="118" height="26" rx="13"/>
        <rect x="-186" y="-52" width="126" height="28" rx="14"/>
        <rect x="-34" y="-46" width="118" height="26" rx="13"/>
        <rect x="110" y="-52" width="126" height="28" rx="14"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="url(#base)"/>
  <rect width="1600" height="1200" fill="url(#tile)"/>
  <rect width="1600" height="1200" fill="url(#ember)"/>

  <!-- Jeruji panggangan, samar di bawah. -->
  <g stroke="#0c0a09" stroke-opacity="0.30" stroke-width="7" stroke-linecap="round">
    <line x1="120" y1="1010" x2="1480" y2="1010"/>
    <line x1="120" y1="1064" x2="1480" y2="1064"/>
    <line x1="120" y1="1118" x2="1480" y2="1118"/>
  </g>

  <g transform="translate(800 760) rotate(-13)">
    <use href="#skewer" transform="translate(-40 -250) rotate(-3)"/>
    <use href="#skewer" transform="translate(30 -40)"/>
    <use href="#skewer" transform="translate(-60 170) rotate(2)"/>
  </g>

  <!-- Asap tipis naik dari bara. -->
  <g fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="14" stroke-linecap="round">
    <path d="M430 930 C 470 840, 390 790, 440 690 C 470 630, 430 590, 452 540"/>
    <path d="M1160 950 C 1200 860, 1120 810, 1170 710 C 1200 650, 1160 610, 1182 560"/>
  </g>

  <rect width="1600" height="1200" fill="url(#vignette)"/>
</svg>
