<?xml version="1.0" encoding="UTF-8"?>
<!--
  Latar halaman masuk 3 — teh Turki dan baklava.

  Gelas teh Turki berbentuk tulip (ince belli) di atas tawus, ditemani
  potongan baklava berbentuk belah ketupat. Motif latarnya tulip Utsmani,
  bentuk yang sama yang melahirkan bentuk gelasnya.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="Teh Turki dan baklava">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="0.5" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>

    <radialGradient id="warm" cx="0.62" cy="0.3" r="0.72">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette3" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </radialGradient>

    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#7c2d12" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Tulip Utsmani. -->
    <pattern id="tulips" width="180" height="220" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#fde68a" stroke-opacity="0.12" stroke-width="2">
        <path d="M90 68 C 62 82, 56 128, 90 156 C 124 128, 118 82, 90 68 Z"/>
        <path d="M90 68 C 90 46, 76 38, 68 48"/>
        <path d="M90 68 C 90 46, 104 38, 112 48"/>
        <line x1="90" y1="156" x2="90" y2="196"/>
      </g>
    </pattern>

    <!-- Gelas teh tulip di atas tawus. -->
    <g id="glass">
      <ellipse cy="196" rx="112" ry="30" fill="#0c0a09" fill-opacity="0.34"/>
      <ellipse cy="196" rx="112" ry="30" fill="none" stroke="#fde68a" stroke-opacity="0.34" stroke-width="3"/>
      <ellipse cy="196" rx="70" ry="18" fill="none" stroke="#fde68a" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M-62 -140 C -46 -60, -76 -20, -40 186 L 40 186 C 76 -20, 46 -60, 62 -140 Z" fill="url(#brew)"/>
      <path d="M-62 -140 C -46 -60, -76 -20, -40 186 L 40 186 C 76 -20, 46 -60, 62 -140 Z"
            fill="none" stroke="#fde68a" stroke-opacity="0.46" stroke-width="4"/>
      <ellipse cy="-140" rx="62" ry="15" fill="#fcd34d" fill-opacity="0.34"/>
      <ellipse cy="-140" rx="62" ry="15" fill="none" stroke="#fde68a" stroke-opacity="0.5" stroke-width="3"/>
    </g>

    <!-- Sepotong baklava: belah ketupat berlapis. -->
    <g id="baklava">
      <path d="M0 -62 L 84 0 L 0 62 L -84 0 Z" fill="#fbbf24" fill-opacity="0.34"/>
      <path d="M0 -62 L 84 0 L 0 62 L -84 0 Z" fill="none" stroke="#fde68a" stroke-opacity="0.42" stroke-width="3"/>
      <path d="M0 -34 L 46 0 L 0 34 L -46 0 Z" fill="#65a30d" fill-opacity="0.34"/>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="url(#dusk)"/>
  <rect width="1600" height="1200" fill="url(#tulips)"/>
  <rect width="1600" height="1200" fill="url(#warm)"/>

  <!-- Permukaan meja. -->
  <path d="M0 880 L 1600 812 L 1600 1200 L 0 1200 Z" fill="#0c0a09" fill-opacity="0.26"/>

  <g transform="translate(470 700) scale(1.06)"><use href="#glass"/></g>
  <g transform="translate(760 810) scale(0.86)"><use href="#glass"/></g>

  <g transform="translate(1180 760)">
    <ellipse cy="86" rx="215" ry="58" fill="#0c0a09" fill-opacity="0.30"/>
    <ellipse cy="86" rx="215" ry="58" fill="none" stroke="#fde68a" stroke-opacity="0.30" stroke-width="4"/>
    <use href="#baklava" transform="translate(-96 56) scale(0.92)"/>
    <use href="#baklava" transform="translate(30 76) scale(0.86)"/>
    <use href="#baklava" transform="translate(132 46) scale(0.8)"/>
  </g>

  <!-- Uap dari gelas terdepan. -->
  <g fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="11" stroke-linecap="round">
    <path d="M440 520 C 476 456, 408 420, 448 350 C 470 310, 444 286, 460 252"/>
    <path d="M520 536 C 552 480, 492 448, 528 386"/>
  </g>

  <rect width="1600" height="1200" fill="url(#vignette3)"/>
</svg>
